<mat-card class="fun-card">

  <img class="decor star-img" [src]="estrelaImg" >
  <div class="decor bubble"></div>

  <mat-card-header>
    <mat-card-title>{{ titulo }}</mat-card-title>
    <mat-card-subtitle>{{ subtitulo }}</mat-card-subtitle>
  </mat-card-header>

  <img mat-card-image [src]="imagem">

  <mat-card-content>
    <p>{{ descricao }}</p>
  </mat-card-content>

  <mat-card-actions>
    <button mat-button>VER MAIS</button>
  </mat-card-actions>

</mat-card>
